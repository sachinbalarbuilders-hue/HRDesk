<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #dcdcdc;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #poster {
            width: 1080px; height: 1080px;
            flex: 0 0 auto;
            position: relative;
            background: linear-gradient(160deg, #FFEFE5 0%, #FDE2E4 45%, #E5F1FF 100%);
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
        }

        /* Confetti shapes */
        .confetti { position: absolute; }
        .c1 { top: 85px; left: 110px; width: 28px; height: 28px; background: #FFB4A2; border-radius: 50%; }
        .c2 { top: 160px; left: 270px; width: 20px; height: 20px; background: #6EC6CA; transform: rotate(20deg); }
        .c3 { top: 75px; right: 160px; width: 24px; height: 24px; background: #FFD166; border-radius: 4px; transform: rotate(15deg); }
        .c4 { top: 230px; right: 320px; width: 16px; height: 16px; background: #B892FF; border-radius: 50%; }
        .c5 { bottom: 110px; left: 160px; width: 30px; height: 30px; background: #6EC6CA; border-radius: 50%; }
        .c6 { bottom: 180px; left: 320px; width: 20px; height: 20px; background: #FFB4A2; transform: rotate(30deg); }
        .c7 { bottom: 120px; right: 130px; width: 24px; height: 24px; background: #B892FF; border-radius: 4px; transform: rotate(-10deg); }
        .c8 { bottom: 250px; right: 290px; width: 16px; height: 16px; background: #FFD166; border-radius: 50%; }

        .ribbon-strip {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 18px;
            background: repeating-linear-gradient(90deg, #FF9F80 0 50px, #6EC6CA 50px 100px, #FFD166 100px 150px, #B892FF 150px 200px);
        }

        .content {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 35px;
            box-sizing: border-box;
        }

        .balloon-row {
            display: flex;
            gap: 16px;
            margin-bottom: 0;
            font-size: 45px;
        }

        .eyebrow {
            font-family: 'Fredoka', sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: #FF7A5C;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 5px 0 0 0;
        }

        .headline {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 75px;
            color: #3A3A3A;
            line-height: 1.05;
            margin: 0;
            text-align: center;
        }

        .headline .accent {
            color: #FF7A5C;
        }

        .photo-frame {
            width: 420px; height: 420px;
            border-radius: 45% 55% 50% 50% / 55% 50% 50% 45%;
            padding: 12px;
            background: white;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            box-sizing: border-box;
            margin: 15px 0 15px 0;
        }

        .photo-frame-inner {
            width: 100%; height: 100%;
            border-radius: 45% 55% 50% 50% / 55% 50% 50% 45%;
            overflow: hidden;
            background: linear-gradient(135deg, #FFD9C7, #C7E8FF);
        }

        .photo-frame-inner img {
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .photo-placeholder {
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(60,60,60,0.55);
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            padding: 12px;
            box-sizing: border-box;
        }

        .years-pill {
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            background: #FFD166;
            color: #3A3A3A;
            padding: 10px 30px;
            border-radius: 50px;
            margin-bottom: 15px;
            font-family: 'Fredoka', sans-serif;
        }

        .years-pill .num {
            font-weight: 700;
            font-size: 28px;
            line-height: 1;
        }

        .years-pill .label {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .name {
            font-family: 'Fredoka', sans-serif;
            font-size: 40px;
            font-weight: 600;
            color: #3A3A3A;
            text-align: center;
            margin: 0 0 10px 0;
        }

        .message {
            font-size: 20px;
            font-weight: 500;
            color: #555;
            text-align: center;
            max-width: 700px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .footer {
            margin-top: auto;
            margin-bottom: 30px;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 3px;
            color: #FF7A5C;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="poster">

        <div class="ribbon-strip"></div>
        <div class="confetti c1"></div>
        <div class="confetti c2"></div>
        <div class="confetti c3"></div>
        <div class="confetti c4"></div>
        <div class="confetti c5"></div>
        <div class="confetti c6"></div>
        <div class="confetti c7"></div>
        <div class="confetti c8"></div>

        <div class="content">
            <div class="balloon-row">🎈 🎉 🎈</div>
            <div class="eyebrow">Cheers to</div>
            <div class="headline">Work <span class="accent">Anniversary!</span></div>

            <div class="photo-frame">
                <div class="photo-frame-inner">
                    <img src="{{PHOTO_BASE64}}" alt="Employee Photo">
                </div>
            </div>

            <div class="years-pill">
                <span class="num">{{YEARS}}</span>
                <span class="label">Years Completed</span>
            </div>

            <div class="name">{{EMPLOYEE_NAME}}</div>

            <div class="message">
                Happy work anniversary! Thank you for your energy,<br>
                creativity, and everything you bring to the team.<br>
                Wishing you many more years of great work<br>
                and even better memories with us!
            </div>

            <div class="footer">Setu Developers</div>
        </div>

    </div>
</body>
</html>
