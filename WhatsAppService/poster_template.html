<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Great+Vibes&family=Montserrat:wght@400;500;600&family=Abril+Fatface&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #e9e6df; /* neutral page background, avoids color bleed past the poster edge */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #poster {
            width: 1080px; height: 1080px;
            flex: 0 0 auto;
            position: relative;
            background-color: #c9c1ae; /* Beige poster background */
            box-sizing: border-box;
            overflow: hidden;
        }


        /* Right Photo Container */
        .photo-container {
            position: absolute;
            right: 0px; 
            top: 190px;
            bottom: 190px;
            width: 440px; 
            background-color: white;
            border-top-left-radius: 60px;
            border-bottom-left-radius: 60px;
            padding: 15px 0px 15px 15px; /* White border on top, left, bottom */
            box-sizing: border-box;
            z-index: 10;
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-top-left-radius: 45px;
            border-bottom-left-radius: 45px;
            display: block;
        }

        /* Left Content Area */
        .left-content {
            position: absolute;
            left: 0;
            top: 0;
            width: 640px; /* Span to the photo container */
            height: 1080px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* Embellishments */
        .embellishment {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            width: 100%;
            z-index: 6; /* above banner */
        }
        
        .embellishment svg {
            width: 250px;
            height: 25px;
        }

        /* Typography */
        .text-happy {
            font-family: 'Great Vibes', cursive;
            font-size: 150px;
            color: #111;
            margin: 0;
            line-height: 1;
            margin-bottom: -15px;
            text-align: center;
            z-index: 6;
        }

        .text-birthday {
            font-family: 'Abril Fatface', serif;
            font-size: 95px;
            font-weight: 400;
            color: #000;
            margin: 0;
            line-height: 1.1;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            z-index: 6;
        }

        /* Name Band Container */
        .name-band-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 65px 0 45px 0;
            z-index: 6;
        }

        .white-line {
            width: 100%;
            height: 25px;
            background-color: white;
        }

        .name-band {
            background-color: #ede7dd; /* lighter beige */
            width: 100%;
            padding: 25px 0;
            text-align: center;
        }

        .text-name {
            font-family: 'Great Vibes', cursive;
            font-size: 85px;
            color: #111;
            margin: 0;
            line-height: 1;
            white-space: nowrap;
        }

        /* Message */
        .text-message {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 500;
            color: #1a1a1a;
            text-align: center;
            max-width: 480px;
            line-height: 1.6;
            margin: 30px 0;
            z-index: 6;
        }
        {{DYNAMIC_CSS}}
    </style>
</head>
<body>
    <div id="poster">

        <!-- Left Content -->
        <div class="left-content">
            <!-- Top Embellishment Removed -->

            <div class="text-happy">Happy</div>
            <div class="text-birthday">BIRTHDAY</div>

            <div class="name-band-container">
                <div class="white-line"></div>
                <div class="name-band">
                    <div class="text-name">{{EMPLOYEE_NAME}}</div>
                </div>
                <div class="white-line"></div>
            </div>

            <div class="text-message">
                Many Many Happy returns of the day,<br>Our entire Setu Developers family<br>wishes you a very Happy Birthday &<br>Wishes you best on your special day!
            </div>

            <!-- Bottom Embellishment Removed -->
        </div>

        <!-- Right Photo -->
        <div class="photo-container">
            <img src="{{PHOTO_BASE64}}" alt="Employee Photo">
        </div>

    </div>
</body>
</html>
