name: hrdesk_mobile
description: HRDesk Mobile — Employee Attendance & HR

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client with interceptors
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # GPS / location
  geolocator: ^13.0.2
  permission_handler: ^12.0.3

  # Camera
  camera: ^0.12.0+1

  # Face liveness detection + Face ID (enrollment + verification)
  # Replaces manual camera + google_mlkit_face_detection
  flutter_face_liveness: ^3.2.0

  # State management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  tflite_flutter: ^0.12.1
